version: '3.8'
services:
  db: 
    image: postgres:latest
    container_name: campusloop-db
    restart: always
    environment:
      POSTGRES_DB: campusloop
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: campusloop-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:latest
    container_name: campusloop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"   # S3 API Endpoint
      - "9001:9001"   # Web UI Console
    volumes:
      - minio_data:/data


volumes:
  postgres_data:
  minio_data: