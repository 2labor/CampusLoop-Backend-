version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: campusloop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusloop}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER environment variable is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campusloop_internal

  redis:
    image: redis:7.2-alpine
    container_name: campusloop-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - campusloop_internal

networks:
  campusloop_internal:
    driver: bridge

volumes:
  postgres_data:
